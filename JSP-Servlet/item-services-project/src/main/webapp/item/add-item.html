<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/><title>Add Item</title></head>
<body>
  <h2>Add Item</h2>
  <form id="addForm" method="post" action="<%=request.getContextPath()%>/ItemController">
    <input type="hidden" name="action" value="add">
    <label>Name: <input type="text" name="name" id="name" required minlength="2"></label><br/>
    <label>Price: <input type="number" name="price" id="price" required step="0.01" min="0"></label><br/>
    <label>totalNumber: <input type="number" name="totalNumber" id="totalNumber" required min="0"></label><br/>
    <button type="submit">Add</button>
  </form>

<script>
document.getElementById('addForm').addEventListener('submit', function(e){
  const n = document.getElementById('name').value.trim();
  const p = parseFloat(document.getElementById('price').value);
  const t = parseInt(document.getElementById('totalNumber').value, 10);
  if (n.length < 2){ alert('Name must be at least 2 characters'); e.preventDefault(); return; }
  if (isNaN(p) || p < 0){ alert('Price must be a non-negative number'); e.preventDefault(); return; }
  if (isNaN(t) || t < 0){ alert('totalNumber must be a non-negative integer'); e.preventDefault(); return; }
});
</script>
</body>
</html>
